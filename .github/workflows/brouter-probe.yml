name: BRouter probe

# Temporary: checks that route options change the route offline (one process, several requests).
on:
  push:
    paths: [".github/workflows/brouter-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: |
          git clone -q --branch v1.7.10 --depth 1 https://github.com/abrensch/brouter.git b
          sed -n 1,140p b/brouter-core/src/main/java/btools/router/ProfileCache.java
          mkdir -p seg cls
          curl -sS -o seg/W10_N35.rd5 https://brouter.de/brouter/segments4/W10_N35.rd5
          cat > Smoke.java <<'J'
          import btools.router.*; import java.io.File; import java.util.*;
          public class Smoke { public static void main(String[] a) throws Exception {
            String[][] opts = {
              {}, {"avoid_toll","1"}, {"avoid_motorways","1"}, {"vmax","70"},
              {"vmax","80","avoid_motorways","1","use_offroad","1","consider_town","1","consider_forest","1"}, {} };
            for (String[] o : opts) {
              RoutingContext rc = new RoutingContext();
              rc.localFunction = new File(a[1], "car-vario.brf").getAbsolutePath();
              rc.keyValues = new HashMap<>();
              for (int i = 0; i < o.length; i += 2) rc.keyValues.put(o[i], o[i + 1]);
              // Lisboa (Marques de Pombal) -> Setubal: toll bridges and A2 vs the N10 round the estuary.
              List<OsmNodeNamed> wp = new RoutingParamCollector().readPositions(new double[]{-9.1500, -8.8930}, new double[]{38.7253, 38.5244});
              long t0 = System.currentTimeMillis();
              RoutingEngine re = new RoutingEngine(null, null, new File(a[0]), wp, rc);
              re.quite = true; re.doRun(60000);
              OsmTrack t = re.getFoundTrack();
              System.out.println(Arrays.toString(o) + " err=" + re.getErrorMessage() + " ms=" + (System.currentTimeMillis() - t0) + " dist=" + (t == null ? -1 : t.distance) + " time=" + (t == null ? -1 : t.getTotalSeconds()));
            }
          }}
          J
          find b/brouter-core b/brouter-mapaccess b/brouter-util b/brouter-expressions b/brouter-codec -path '*src/main/java*' -name '*.java' > files.txt
          javac -nowarn -d cls @files.txt Smoke.java 2>&1 | tail -5
          java -Xmx256m -cp cls Smoke seg b/misc/profiles2
          echo "== online"; curl -sS "https://brouter.de/brouter?alternativeidx=0&format=geojson&profile=car-vario&profile:avoid_toll=1&lonlats=-9.15,38.7253%7C-8.893,38.5244" | head -c 600
