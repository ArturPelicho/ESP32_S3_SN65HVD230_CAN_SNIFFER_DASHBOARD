name: BRouter probe

# Temporary: checks the BRouter library calls the app will make, routing offline from a real segment.
on:
  push:
    paths: [".github/workflows/brouter-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: |
          git clone -q --branch v1.7.10 --depth 1 https://github.com/abrensch/brouter.git b
          mkdir -p seg cls
          curl -sS -o seg/W10_N35.rd5 https://brouter.de/brouter/segments4/W10_N35.rd5
          f=$(find b -name ProfileCache.java | head -1); echo "== $f"; grep -nE 'profileBaseDir|localFunction|lookups|getParentFile' "$f"
          cat > Smoke.java <<'J'
          import btools.router.*; import java.io.File; import java.util.*;
          public class Smoke { public static void main(String[] a) throws Exception {
            for (String prof : new String[]{"car-vario", "moped"}) {
              RoutingContext rc = new RoutingContext();
              rc.localFunction = new File(a[1], prof + ".brf").getAbsolutePath();
              List<OsmNodeNamed> wp = new RoutingParamCollector().readPositions(new double[]{-9.1393, -9.3817}, new double[]{38.7223, 38.7979});
              long t0 = System.currentTimeMillis();
              RoutingEngine re = new RoutingEngine(null, null, new File(a[0]), wp, rc);
              re.quite = true; re.doRun(60000);
              OsmTrack t = re.getFoundTrack();
              System.out.println(prof + " err=" + re.getErrorMessage() + " ms=" + (System.currentTimeMillis() - t0) + " nodes=" + (t == null ? -1 : t.nodes.size()) + " dist=" + (t == null ? -1 : t.distance));
              if (t != null && !t.nodes.isEmpty()) { OsmPathElement e = t.nodes.get(0); System.out.println("first " + e.getILon() + "," + e.getILat() + "," + e.getElev()); }
            }
            // Missing segment: what does it say?
            RoutingContext rc = new RoutingContext(); rc.localFunction = new File(a[1], "car-vario.brf").getAbsolutePath();
            RoutingEngine re = new RoutingEngine(null, null, new File(a[0]), new RoutingParamCollector().readPositions(new double[]{2.35, 2.29}, new double[]{48.85, 48.86}), rc);
            re.quite = true; re.doRun(20000); System.out.println("paris err=" + re.getErrorMessage());
          }}
          J
          find b/brouter-core b/brouter-mapaccess b/brouter-util b/brouter-expressions b/brouter-codec -path '*src/main/java*' -name '*.java' > files.txt
          javac -nowarn -d cls @files.txt Smoke.java 2>&1 | tail -5
          java -Xmx256m -cp cls Smoke seg b/misc/profiles2
